---
- name: Full Configuration for Go-SRV
  hosts: my_servers
  become: true
  vars:
    # Use the latest stable version of Kind
    kind_version: "v0.26.0"
    # Go toolchain version to install on the server
    go_version: "1.23.4"
    target_user: "roman"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        upgrade: dist

    - name: Determine Go architecture
      ansible.builtin.set_fact:
        go_arch: >-
          {{
            'amd64' if (ansible_facts.architecture | default('x86_64')) in ['x86_64', 'amd64'] else
            'arm64' if (ansible_facts.architecture | default('x86_64')) in ['aarch64', 'arm64'] else
            'amd64'
          }}

    - name: Read currently installed Go version (if any)
      ansible.builtin.command: /usr/local/go/bin/go version
      register: go_current_version
      changed_when: false
      failed_when: false

    - name: Decide whether Go install/update is needed
      ansible.builtin.set_fact:
        go_needs_install: >-
          {{
            (go_current_version.rc != 0)
            or
            (go_current_version.stdout is not search('go' ~ go_version))
          }}

    - name: Remove existing Go install if version differs
      ansible.builtin.file:
        path: /usr/local/go
        state: absent
      when:
        - go_needs_install

    - name: Download Go tarball
      ansible.builtin.get_url:
        url: "https://go.dev/dl/go{{ go_version }}.linux-{{ go_arch }}.tar.gz"
        dest: "/tmp/go{{ go_version }}.linux-{{ go_arch }}.tar.gz"
        mode: '0644'
      when:
        - go_needs_install

    - name: Install Go to /usr/local
      ansible.builtin.unarchive:
        src: "/tmp/go{{ go_version }}.linux-{{ go_arch }}.tar.gz"
        dest: /usr/local
        remote_src: true
      when:
        - go_needs_install

    - name: Ensure Go is on PATH for all users
      ansible.builtin.copy:
        dest: /etc/profile.d/go.sh
        mode: '0644'
        content: |
          export PATH=/usr/local/go/bin:$PATH

    - name: Ensure go is available on PATH (/usr/local/bin)
      ansible.builtin.file:
        src: /usr/local/go/bin/go
        dest: /usr/local/bin/go
        state: link

    - name: Ensure gofmt is available on PATH (/usr/local/bin)
      ansible.builtin.file:
        src: /usr/local/go/bin/gofmt
        dest: /usr/local/bin/gofmt
        state: link

    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - prometheus-node-exporter
          - git
        state: present

    - name: Set vim as the default editor
      community.general.alternatives:
        name: editor
        path: /usr/bin/vim.basic

    # --- 1. DOCKER SETUP ---
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: >-
          deb [arch={{
            'amd64' if (ansible_facts.architecture | default('x86_64')) in ['x86_64', 'amd64'] else
            'arm64' if (ansible_facts.architecture | default('x86_64')) in ['aarch64', 'arm64'] else
            'amd64'
          }}] https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release | default('jammy') }} stable
        state: present

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Add users to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: yes
      loop: "{{ [target_user, (ansible_user | default(target_user))] | unique }}"

    # --- 2. BOTTOM (BTM) SETUP ---
    - name: Install Bottom (btm) via Snap
      snap:
        name: bottom
        classic: yes

    # --- 3. ACT (GitHub Actions runner) ---
    - name: Check if act is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/act
      register: act_bin

    - name: Download act installer script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/nektos/act/master/install.sh
        dest: /tmp/act-install.sh
        mode: '0755'
      when: not act_bin.stat.exists

    - name: Run act installer script
      ansible.builtin.command: bash /tmp/act-install.sh
      args:
        chdir: /tmp
        creates: /tmp/bin/act
      when: not act_bin.stat.exists

    - name: Move act binary to /usr/local/bin
      ansible.builtin.copy:
        src: /tmp/bin/act
        dest: /usr/local/bin/act
        mode: '0755'
        remote_src: true
      when: not act_bin.stat.exists

    # --- 4. KIND SETUP ---
    - name: Download Kind binary
      get_url:
        url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
        dest: /usr/local/bin/kind
        mode: '0755'

    # --- 5. SYSTEM LIMITS (For Kind) ---
    - name: Increase inotify limits for Kind clusters
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      with_items:
        - { name: 'fs.inotify.max_user_watches', value: '524288' }
        - { name: 'fs.inotify.max_user_instances', value: '512' }

    - name: Ensure services are started
      service:
        name: "{{ item }}"
        state: started
        enabled: yes
      with_items:
        - docker
        - prometheus-node-exporter

