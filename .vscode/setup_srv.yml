---
- name: Full Configuration for Go-SRV
  hosts: my_servers
  become: true
  vars:
    # Use the latest stable version of Kind
    kind_version: "v0.26.0"
    target_user: "roman"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - prometheus-node-exporter
          - git
        state: present

    - name: Set vim as the default editor
      community.general.alternatives:
        name: editor
        path: /usr/bin/vim.basic

    # --- 1. DOCKER SETUP ---
    - name: Ensure /etc/apt/keyrings exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Add user to docker group
      user:
        name: "{{ target_user }}"
        groups: docker
        append: yes

    # --- 2. BOTTOM (BTM) SETUP ---
    - name: Install Bottom (btm) via Snap
      snap:
        name: bottom
        classic: yes

    # --- 3. KIND SETUP ---
    - name: Download Kind binary
      get_url:
        url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
        dest: /usr/local/bin/kind
        mode: '0755'

    # --- 4. SYSTEM LIMITS (For Kind) ---
    - name: Increase inotify limits for Kind clusters
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      with_items:
        - { name: 'fs.inotify.max_user_watches', value: '524288' }
        - { name: 'fs.inotify.max_user_instances', value: '512' }

    - name: Ensure services are started
      service:
        name: "{{ item }}"
        state: started
        enabled: yes
      with_items:
        - docker
        - prometheus-node-exporter

